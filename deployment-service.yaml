apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankingapp
  labels:
    app: bank
  namespace: devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bank
  
  template:
    metadata:
      labels:
        app: bank
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
      - name: bankapp
        image: ${DOCKER_IMG}:${DOCKER_TAG}
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: bankapp-service
  namespace: devops
spec:
  selector:
    app: bank
  type: NodePort
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
